
name: temirkhan-yernar-student-api

services:
  db:
    image: postgres:16-alpine
    container_name: temirkhan-yernar-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - student-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    image: temirkhan-yernar-student-api:v1.1-temirkhan-yernar-37722
    container_name: temirkhan-yernar-student-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8080"
    networks:
      - student-net
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  student-net:
    driver: bridge

